[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "FIFA"
version = "0.1.0"
description = "Read and quality-filter ZTF and ATLAS forced-photometry light curves"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "openpyxl",
    "astropy",
    "matplotlib"
]

[tool.setuptools]
packages = ["FIFA"]
